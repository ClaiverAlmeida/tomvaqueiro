<script>
(function () {
  // Canvas de largura fixa: escala para caber na viewport, centralizado.
  // Limitado a 1 para nao ampliar o desenho alem do tamanho de origem.
  var el = document.getElementById('canvas');
  var agendado = 0;

  function aplicar() {
    agendado = 0;
    var w = el.offsetWidth, h = el.offsetHeight;
    var vw = document.documentElement.clientWidth || window.innerWidth;
    var vh = document.documentElement.clientHeight || window.innerHeight;
    if (!vw || !vh || !w || !h) return;
    el.style.setProperty('--fit', Math.min(vw / w, vh / h, 1));
  }

  function agendar() { if (!agendado) agendado = requestAnimationFrame(aplicar); }

  agendar();
  window.addEventListener('resize', agendar);
  window.addEventListener('orientationchange', agendar);
  // as fontes do Google mudam metricas ao carregar; reajusta quando chegarem
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(agendar);

  // Bloqueio de zoom. O Safari do iOS ignora user-scalable=no desde o
  // iOS 10, entao o pinch precisa ser barrado no evento. Os listeners
  // sao passive:false de proposito - sem isso o preventDefault nao vale.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  // duplo-toque: o touch-action cobre a maioria dos casos, isto pega o resto
  var ultimo = 0;
  document.addEventListener('touchend', function (e) {
    var agora = e.timeStamp;
    if (agora - ultimo < 300) e.preventDefault();
    ultimo = agora;
  }, { passive: false });
  // ctrl/cmd + scroll no desktop
  document.addEventListener('wheel', function (e) {
    if (e.ctrlKey || e.metaKey) e.preventDefault();
  }, { passive: false });

  // Hover ao arrastar o dedo. No touch o :hover so entra depois do
  // toque e fica grudado; aqui o card sob o dedo recebe .ativo e larga
  // assim que o dedo sai. elementFromPoint usa coordenadas de tela e ja
  // leva em conta o scale do canvas, entao nao precisa converter nada.
  var ativo = null;

  function marcar(el) {
    if (ativo === el) return;
    if (ativo) ativo.classList.remove('ativo');
    ativo = el;
    if (ativo) ativo.classList.add('ativo');
  }

  function sobODedo(toque) {
    var el = document.elementFromPoint(toque.clientX, toque.clientY);
    return el && el.closest ? el.closest('.lnk') : null;
  }

  ['touchstart', 'touchmove'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      if (e.touches.length === 1) marcar(sobODedo(e.touches[0]));
    }, { passive: true });
  });

  ['touchend', 'touchcancel'].forEach(function (ev) {
    // segura um instante para o efeito ser visto antes de soltar
    document.addEventListener(ev, function () {
      setTimeout(function () { marcar(null); }, 180);
    }, { passive: true });
  });
})();
</script>
